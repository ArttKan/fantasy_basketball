{% extends "layout.html" %}

{% block title %}{{ user.username }}{% endblock %}

{% block content %}
    <h2>{{ user.username }}</h2>
    <h2>ID: {{ user.id }}</h2>
    <p>
      Teams ({{ teams | count }}):
      {% for team in teams %}
      <li><a href="/team/{{ team.id }}">{{ team.team }}</a></li>
      {% endfor %}
    </p>
    <p>
      <a href="/">Back</a>
    </p>
{% endblock %}
